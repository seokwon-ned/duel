name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  node20-engine-strict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm ci must fail on Node 20
        run: |
          set +e
          OUTPUT="$(npm ci 2>&1)"
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -eq 0 ]; then
            echo "npm ci on Node 20 must fail (engine-strict, engines.node >=22)"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -Eq 'EBADENGINE|engine-strict|Unsupported engine'; then
            echo "npm ci failed, but not because of engine-strict"
            exit 1
          fi
          echo "npm ci correctly rejected Node 20"

  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Engine strict typecheck
        run: npm run typecheck:strict --workspace=packages/engine
      
      - name: Run tests
        run: npm test
      
      - name: Run crash resistance tests
        run: npm run test:crash --workspace=packages/server
      
      - name: Run lossless sync test
        run: npm run test:lossless --workspace=packages/server
      
      - name: Run fault isolation test
        run: npm run test:fault --workspace=packages/server
      
      - name: Run reconnection tests
        run: npm run test:reconnection --workspace=packages/server

      - name: Run rematch pairing tests
        run: npm run test:rematch --workspace=packages/server

      - name: Run rematch vote/reserve tests
        run: npm run test:my-rematch --workspace=packages/server
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Build client for E2E tests
        run: npm run build --workspace=packages/client
      
      - name: Run Playwright E2E rendering tests
        run: npm run test:e2e:playwright
      
      - name: Build server
        run: npm run build --workspace=packages/server
      
      - name: Build client
        run: npm run build --workspace=packages/client
      
      - name: Test server starts from clean install
        run: |
          npm run server &
          SERVER_PID=$!
          sleep 5
          if ! nc -z localhost 2567; then
            echo "Server failed to listen on port 2567"
            kill $SERVER_PID || true
            exit 1
          fi
          echo "✓ Server listening on port 2567"
          kill $SERVER_PID || true
