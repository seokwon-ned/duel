<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>땅따 | Turf Duel</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png">
  
  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- Theme Color -->
  <meta name="theme-color" content="#0F172A">
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: white;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
    }
    #app {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      box-sizing: border-box;
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 100%;
      padding: 8px;
      overflow: hidden;
    }
    #settings {
      flex: 0 0 auto;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 8px;
      padding: 12px;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
    }
    #settings input {
      padding: 8px;
      margin: 5px 0;
      border-radius: 4px;
      border: 1px solid #ccc;
      max-width: 100%;
      width: min(100%, 260px);
      box-sizing: border-box;
    }
    #settings button {
      padding: 8px 16px;
      margin: 5px 5px 5px 0;
      background: #FF7A1A;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    #settings button:hover {
      background: #e66910;
    }
    .hud-row {
      display: none;
      flex: 0 0 auto;
      position: relative;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 1.6em;
      box-sizing: border-box;
      padding: 6px 32px 8px;
    }
    #matchHud {
      width: 100%;
      text-align: center;
      font-size: 16px;
      line-height: 1.3;
      color: #ffffff;
      word-break: keep-all;
    }
    #matchHud.result {
      font-size: 18px;
      font-weight: 700;
      color: #FFD166;
    }
    #debugToggle {
      display: none;
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      margin: 0;
      padding: 4px 8px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #64748b;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
    }
    #debugToggle[aria-pressed="true"] {
      color: #FF7A1A;
    }
    #game-container {
      flex: 1 1 auto;
      position: relative;
      width: 100%;
      min-height: 0;
      overflow: hidden;
    }
    #info {
      margin-top: 8px;
      font-size: 14px;
      color: #aaa;
    }
    #app.playing {
      padding: 4px;
    }
    #app.playing #settings {
      display: none;
    }
    #app.playing .hud-row,
    #app.playing #debugToggle {
      display: flex;
    }
    #app.playing #debugToggle {
      display: block;
    }
    #app.playing.debug #settings {
      display: block;
      position: absolute;
      left: 8px;
      right: 8px;
      top: 40px;
      z-index: 20;
      margin: 0;
      max-height: calc(50% - 40px);
      overflow: auto;
      background: rgba(15, 23, 42, 0.94);
    }
    @media (min-width: 600px) {
      #app {
        padding: 20px;
      }
      #settings {
        padding: 20px;
        margin-bottom: 20px;
      }
      #app.playing {
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="settings">
      <h2 style="display: flex; align-items: center; gap: 10px;">
        <img src="/logo.png" alt="땅따 | Turf Duel" style="height: 40px;">
      </h2>
      <div class="server-url">
        <label>Server URL:</label>
        <input type="text" id="serverUrl" value="ws://localhost:2567" placeholder="ws://localhost:2567">
      </div>
      <div>
        <button id="connectBtn">Connect to Server</button>
        <button id="botBtn">Play vs Bot (Local)</button>
      </div>
      <div id="info">
        <p>Controls: swipe (20px) · Arrow keys or WASD</p>
        <p id="status">Ready to connect</p>
      </div>
    </div>
    <div class="hud-row">
      <div id="matchHud" aria-live="polite"></div>
      <button type="button" id="debugToggle" aria-label="서버 정보" aria-pressed="false">⚙</button>
    </div>
    <div id="game-container"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
